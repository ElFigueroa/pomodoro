<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>Reloj Pomodoro | Focus Music</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%23ff6b6b'>🍅</text></svg>">
</head>
<body>
    <div id="background-container" class="background-container">
        <canvas id="background-video-canvas"></canvas>
    </div>

    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <h1 class="title">Focus Music</h1>
            <div class="header-controls">
                <button id="btn-music-toggle" class="btn-icon">
                    <span class="icon">♪</span>
                </button>
                <button id="btn-settings" class="btn-icon">
                    <span class="icon">⚙</span>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- POMODORO TIMER -->
            <section class="timer-section">
                <div class="cycle-indicator">
                    <span id="cycle-name" class="cycle-name">Setup</span>
                    <span id="cycle-number" class="cycle-number">Prep</span>
                </div>
                
                <div class="timer-display">
                    <div class="timer-number">
                        <span id="timer-minutes">05</span>
                        <span class="timer-separator">:</span>
                        <span id="timer-seconds">00</span>
                    </div>
                </div>

                <div class="timer-controls">
                    <button id="btn-start" class="btn-primary btn-control">
                        <span class="icon">▶</span>
                    </button>
                    <button id="btn-pause" class="btn-secondary btn-control" disabled>
                        <span class="icon">⏸</span>
                    </button>
                    <button id="btn-stop" class="btn-secondary btn-control">
                        <span class="icon">⏹</span>
                    </button>
                </div>

                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </section>

            <!-- AUDIO VISUALIZER -->
            <section class="visualizer-section">
                <canvas id="visualizer-canvas" class="visualizer-canvas"></canvas>
            </section>
        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <button id="btn-background" class="btn-secondary footer-btn">
                <span class="icon">◻</span>
                <span class="text">Fondo</span>
            </button>
            <input type="file" id="background-input" accept="image/*,video/*" style="display: none;">
            
            <!-- Music Player Controls -->
            <div class="music-player-controls">
                <div class="current-track-info">
                    <span id="current-track-name" class="current-track-name">Sin música</span>
                </div>
                <div class="music-controls-buttons">
                    <button id="btn-shuffle" class="btn-icon" title="Aleatorio">
                        <span class="icon">⇄</span>
                    </button>
                    <button id="btn-loop" class="btn-icon" title="Repetir">
                        <span class="icon">↺</span>
                    </button>
                    <button id="btn-prev-track" class="btn-icon" title="Canción anterior">
                        <span class="icon">⏮</span>
                    </button>
                    <button id="btn-play-music" class="btn-icon" title="Reproducir">
                        <span class="icon">▶</span>
                    </button>
                    <button id="btn-pause-music" class="btn-icon" title="Pausar">
                        <span class="icon">⏸</span>
                    </button>
                    <button id="btn-next-track" class="btn-icon" title="Siguiente canción">
                        <span class="icon">⏭</span>
                    </button>
                </div>
            </div>
            
            <div class="volume-control">
                <span class="icon">♪</span>
                <input type="range" id="volume-slider" min="0" max="100" value="70" class="volume-slider">
                <button id="btn-mute" class="btn-icon">
                    <span class="icon">◎</span>
                </button>
            </div>
        </footer>
    </div>

    <!-- MUSIC SELECTOR MODAL -->
    <div id="music-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Música</h2>
                <button class="modal-close">&times;</button>
            </div>
            
            <div class="modal-body">
                <div id="local-music">
                    <div class="music-input-group">
                        <div id="drop-zone" class="drop-zone">
                            <div class="drop-zone-icon">♪</div>
                            <p class="drop-zone-text">Arrastra archivos MP3 aquí</p>
                            <p class="drop-zone-sub">o</p>
                            <label for="audio-input" class="btn-primary btn-file-label">Seleccionar archivos</label>
                            <input type="file" id="audio-input" accept="audio/*" multiple style="display:none">
                        </div>
                    </div>
                    
                    <div id="playlist" class="playlist">
                        <h3>Lista de reproducción:</h3>
                        <div id="playlist-items" class="playlist-items">
                            <p class="empty-message">No hay archivos cargados</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-footer">
                <button id="btn-close-modal" class="btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configuración</h2>
                <button class="modal-close">&times;</button>
            </div>
            
            <div class="modal-body">
                <div class="settings-group">
                    <label>
                        <input type="checkbox" id="visualizer-toggle" checked>
                        Mostrar visualizador de audio
                    </label>
                </div>

                <div class="settings-group">
                    <label>
                        <span>Sensibilidad del visualizador:</span>
                        <input type="range" id="visualizer-sensitivity" min="0.5" max="2" step="0.1" value="1" class="slider">
                        <span id="sensitivity-value">1.0</span>
                    </label>
                </div>

                <div class="settings-group">
                    <label>
                        <span>Suavizado:</span>
                        <input type="range" id="visualizer-smoothing" min="0.1" max="0.9" step="0.1" value="0.8" class="slider">
                        <span id="smoothing-value">0.8</span>
                    </label>
                </div>

                <div class="settings-group">
                    <label>
                        <input type="checkbox" id="autoplay-music" checked>
                        Reproducir música automáticamente
                    </label>
                </div>

                <hr>

                <h3>Duración de ciclos (minutos)</h3>
                <div class="settings-group">
                    <label>
                        <span>Setup:</span>
                        <input type="number" id="duration-setup" min="1" max="30" value="5" class="duration-input">
                    </label>
                </div>

                <div class="settings-group">
                    <label>
                        <span>Focus:</span>
                        <input type="number" id="duration-focus" min="1" max="60" value="25" class="duration-input">
                    </label>
                </div>

                <div class="settings-group">
                    <label>
                        <span>Descanso Corto:</span>
                        <input type="number" id="duration-short-break" min="1" max="30" value="5" class="duration-input">
                    </label>
                </div>

                <div class="settings-group">
                    <label>
                        <span>Descanso Largo:</span>
                        <input type="number" id="duration-long-break" min="1" max="60" value="10" class="duration-input">
                    </label>
                </div>

                <button id="btn-reset-settings" class="btn-secondary" style="margin-top: 20px; width: 100%;">
                    Restaurar valores por defecto
                </button>
            </div>

            <div class="modal-footer">
                <button id="btn-close-settings" class="btn-secondary">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/pomodoro.js"></script>
    <script src="js/music-player.js"></script>
    <script src="js/visualizer.js"></script>
    <script src="js/main.js"></script>
    <div id="toast-container" class="toast-container"></div>
</body>
</html>
